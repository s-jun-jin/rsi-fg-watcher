# RSI 단일 지표 백테스트 (수동 실행 전용, 결과는 실행 화면의 Summary에도 표시됨)
name: backtest-rsi

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas numpy

      - run: python backtest/backtest_rsi.py
