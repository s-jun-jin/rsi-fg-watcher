# RSI + 공포탐욕지수 종목 감시 (평일 시장 시간 30분 간격)
# 필요한 Secrets: SLACK_WEBHOOK_URL (필수), WATCHLIST_JSON (선택, 없으면 예시 종목 사용)
name: stock-watch

on:
  schedule:
    # 한국장: 평일 09:00~15:30 KST = 00:00~06:30 UTC, 30분 간격
    - cron: "*/30 0-6 * * 1-5"
    # 미국장: 평일 09:30~16:00 ET. 서머타임 종료 후(11월~3월)는 14:30~21:00 UTC
    # (서머타임 기간 3월~11월 초에는 13-20 으로 바꿔야 함)
    - cron: "*/30 14-21 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas requests

      # 러너는 매번 초기화되므로, 같은 날 중복 알림 방지용 상태 파일을 캐시로 이어받음
      - uses: actions/cache@v4
        with:
          path: watcher_state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - run: python stock_watcher.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
