# RSI 단일 지표 감시 (평일 한국장+미국장 시간대에 5분 간격)
# 필요한 Secrets: SLACK_WEBHOOK_URL
name: stock-watch

on:
  schedule:
    # 5분 간격(GitHub 최소 단위). 13~21시 UTC = 미국 정규장(서머타임 13:30~20:00, 그 외 14:30~21:00)을 모두 덮음. 장 밖에는 가격이 안 변해 알림이 안 감. 실제 실행은 몇 분 지연될 수 있음
    # 한국장: 평일 09:00~15:30 KST = 00:00~06:30 UTC
    - cron: "*/5 0-6 * * 1-5"
    # 미국장
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:      # 수동 실행 버튼
    inputs:
      test_slack:
        description: "Slack 테스트 메시지만 보내기"
        type: boolean
        default: false

permissions:
  contents: read

# 이전 실행이 안 끝났으면 겹치지 않게 하나만 실행
concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas requests

      # 러너는 매번 초기화되므로, 감시 상태(진입/반등 중복 알림 방지)를 캐시로 이어받음
      - uses: actions/cache@v4
        with:
          path: watcher_state.json
          key: rsi-state-${{ github.run_id }}
          restore-keys: rsi-state-

      - run: python stock_watcher.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TEST: ${{ inputs.test_slack }}
