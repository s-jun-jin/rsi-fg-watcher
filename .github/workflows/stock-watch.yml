# RSI 단일 지표 감시 (일봉·주봉, 마감 종가 기준. 평일 한국장·미국장 마감 후 실행)
# 필요한 Secrets: SLACK_WEBHOOK_URL
name: stock-watch

on:
  schedule:
    # 장 마감 후에만 실행(마감 종가 기준). 신호는 연속 2번 확인 후 알리므로 마감 후 3번씩 실행하고,
    # 한 번 누락돼도 다음 실행/다음 날에 이어서 처리됨. GitHub 스케줄은 몇 분 지연될 수 있음
    # 한국장 마감 06:30 UTC -> 07:10, 07:25, 07:40 UTC
    - cron: "10,25,40 7 * * 1-5"
    # 미국장 마감 20:00/21:00 UTC(서머타임 여부) -> 스크립트 기준 21:30 UTC 이후인 21:40, 21:50 UTC + 22:05 UTC
    - cron: "40,50 21 * * 1-5"
    - cron: "5 22 * * 1-5"
  workflow_dispatch:      # 수동 실행 버튼
    inputs:
      test_slack:
        description: "Slack 테스트 메시지만 보내기"
        type: boolean
        default: false

permissions:
  contents: read

# 이전 실행이 안 끝났으면 겹치지 않게 하나만 실행
concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas requests

      # 러너는 매번 초기화되므로, 감시 상태(진입/반등 중복 알림 방지)를 캐시로 이어받음
      - uses: actions/cache@v4
        with:
          path: watcher_state.json
          key: rsi-state-${{ github.run_id }}
          restore-keys: rsi-state-

      - run: python stock_watcher.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TEST: ${{ inputs.test_slack }}
