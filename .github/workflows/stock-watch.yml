# RSI 단일 지표 감시 (평일 미국장 마감 후 1회)
# 필요한 Secrets: SLACK_WEBHOOK_URL
name: stock-watch

on:
  schedule:
    # 21:30 UTC = 미국 정규장 마감(서머타임 20:00 UTC, 그 외 21:00 UTC) 이후. 일봉 종가가 확정된 뒤라 서머타임 설정 변경 불필요
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas requests

      # 러너는 매번 초기화되므로, 감시 상태(진입/반등 중복 알림 방지)를 캐시로 이어받음
      - uses: actions/cache@v4
        with:
          path: watcher_state.json
          key: rsi-state-${{ github.run_id }}
          restore-keys: rsi-state-

      - run: python stock_watcher.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
